name: Angular and Java CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Fork PRs must not receive or execute code with access to private dependencies.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: .devcontainer/docker-compose.yml
      COMPOSE_PROJECT_NAME: nwproject-angular-ci
      E2E_BASE_URL: http://localhost:8081
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check private library credentials
        env:
          JPA_SECURITY_READ_TOKEN: ${{ secrets.JPA_SECURITY_READ_TOKEN }}
        run: |
          if [ -z "$JPA_SECURITY_READ_TOKEN" ]; then
            echo "::error::Set JPA_SECURITY_READ_TOKEN with Contents read access to Anape12/jpa-security."
            exit 1
          fi

      - name: Checkout private encryption library
        uses: actions/checkout@v4
        with:
          repository: Anape12/jpa-security
          ref: ca1485acaee4f554548d998f1f32f2f9c9872b66
          path: .build-deps/jpa-security-source
          token: ${{ secrets.JPA_SECURITY_READ_TOKEN }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create .env
        run: |
          DB_PASSWORD="$(openssl rand -hex 24)"
          MYSQL_ROOT_PASSWORD="$(openssl rand -hex 24)"
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_NAME=nwproject_db" >> .env
          echo "DB_USER=nwproject_app" >> .env
          echo "DB_PASSWORD=$DB_PASSWORD" >> .env
          echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" >> .env
          echo "NW_DB_CONTAINER=nwproject-angular-ci-db" >> .env
          echo "NW_TOMCAT_CONTAINER=nwproject-angular-ci-tomcat" >> .env
          echo "NW_HTTP_PORT=8081" >> .env

      - name: Prepare encryption library
        env:
          JPA_SECURITY_SOURCE: ${{ github.workspace }}/.build-deps/jpa-security-source
        run: bash scripts/bootstrap-security.sh

      - name: Build WAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify Angular assets in WAR
        run: |
          jar tf target/app.war > target/war-entries.txt
          grep -Fxq 'js/angular/main.js' target/war-entries.txt
          find frontend/pages -type f -name '*.html' -printf 'WEB-INF/angular/%P\n' | sort > target/expected-pages.txt
          grep -E '^WEB-INF/angular/.*\.html$' target/war-entries.txt | sort > target/packaged-pages.txt
          diff -u target/expected-pages.txt target/packaged-pages.txt
          if grep -Ei '\.(jsp|jspx|jspf)$' target/war-entries.txt; then
            echo "::error::The WAR contains retired JSP assets."
            exit 1
          fi

      - name: Upload WAR
        # A public WAR exposes the private library's bytecode.
        if: github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: app-war
          path: target/app.war

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build Tomcat image
        run: docker compose --env-file .env build tomcat

      - name: Start database, apply migrations, and start Tomcat
        id: start_containers
        run: |
          docker compose --env-file .env up -d --wait --wait-timeout 180 db
          docker compose --env-file .env run --rm flyway
          docker compose --env-file .env up -d --no-build tomcat

      - name: Wait for Tomcat
        run: |
          for i in {1..30}; do
            if curl --fail --silent --max-time 5 "$E2E_BASE_URL/Login" >/dev/null; then
              echo "Tomcat started"
              exit 0
            fi
            echo "Waiting for Tomcat..."
            sleep 5
          done
          echo "Tomcat startup timeout"
          exit 1

      - name: Run Playwright Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/

      - name: Show Container Logs
        if: failure() && steps.start_containers.outcome != '' && steps.start_containers.outcome != 'skipped'
        run: docker compose --env-file .env logs db tomcat

      - name: Shutdown Containers
        # A failed or cancelled startup can still leave partially started containers.
        if: always() && steps.start_containers.outcome != '' && steps.start_containers.outcome != 'skipped'
        run: docker compose --env-file .env down --volumes

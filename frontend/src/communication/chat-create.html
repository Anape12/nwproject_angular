<main class="chat-create-container">
    <div class="chat-create-heading">
        <div>
            <h1>個別チャットを開始</h1>
            <p>チャットしたいユーザーを選択してください。</p>
        </div>
        <a class="chat-secondary-btn" [href]="contextPath + '/ChatChanelList'">戻る</a>
    </div>
    @if (errorMessage()) {
        <p class="chat-error" role="alert">{{ errorMessage() }}</p>
    }
    <div class="chat-user-list">
        @for (user of users; track user.userId) {
            <form class="chat-user-item" method="post" [action]="contextPath + '/ChatRoomCreate'"
                (submit)="create($event, user.userId)">
                <div class="channel-icon">{{ user.ai ? "AI" : "👤" }}</div>
                <div class="chat-user-info">
                    <strong>
                        {{ user.lastName }} {{ user.firstName }}
                        @if (user.ai) {
                            <span class="ai-user-badge">AI</span>
                        }
                    </strong>
                    <span>{{ user.userId }}</span>
                </div>
                <input type="hidden" name="targetUserId" [value]="user.userId" />
                <button class="chat-start-btn" type="submit" [disabled]="submitting()">チャットを開始</button>
            </form>
        } @empty {
            <p class="chat-empty">チャットを開始できるユーザーがいません。</p>
        }
    </div>
</main>

<div id="container">
    <div class="thread-card">
        <h1 class="page-title">新規スレッド</h1>

        <form [action]="project.url('threadCreate')" method="post">
            <div class="form-group">
                <label for="title">タイトル</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="スレッドタイトルを入力してください"
                    required
                />
            </div>

            <div class="form-group">
                <label for="content">詳細</label>
                <textarea
                    id="content"
                    name="content"
                    rows="8"
                    placeholder="質問内容や相談内容を入力してください"
                    required></textarea>
            </div>

            <div class="button-area">
                <button type="submit" class="primary-btn">スレッドを作成</button>
            </div>
        </form>
    </div>
</div>

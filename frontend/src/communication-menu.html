<header class="mode-header">
    <a [href]="navigation.contextPath + '/CommunicationMenu'">
        <i class="fa-solid fa-comments"></i> NW Communication
    </a>
    <div>
        <a class="switch-mode" [href]="navigation.contextPath + '/MenuSelect'">
            <i class="fa-solid fa-table-cells-large"></i> メニュー切替
        </a>
        <span>{{ navigation.lastName }} {{ navigation.firstName }} さん</span>
    </div>
</header>
<main class="communication-home">
    <div class="communication-intro">
        <span>COMMUNICATION</span>
        <h1>コミュニケーション</h1>
        <p>会話と情報共有に必要な機能だけを、シンプルにまとめています。</p>
    </div>
    <div class="communication-grid">
        <a [href]="navigation.contextPath + '/ChatChanelList'" target="_blank" rel="noopener">
            <span class="communication-icon"><i class="fa-solid fa-comment-dots"></i></span>
            <div>
                <small>REALTIME CHAT</small>
                <h2>チャット</h2>
                <p>ユーザーやグループとの会話を開始・継続します。</p>
                <strong>チャットを開く <i class="fa-solid fa-arrow-right"></i></strong>
            </div>
        </a>
        <a [href]="navigation.contextPath + '/ThreadController'" target="_blank" rel="noopener">
            <span class="communication-icon"><i class="fa-solid fa-users-rectangle"></i></span>
            <div>
                <small>DISCUSSION</small>
                <h2>スレッド</h2>
                <p>テーマごとに情報を整理し、メンバーと共有します。</p>
                <strong>スレッドを開く <i class="fa-solid fa-arrow-right"></i></strong>
            </div>
        </a>
    </div>
    <div class="communication-footer">
        <a [href]="navigation.contextPath + '/MenuSelect'">
            <i class="fa-solid fa-arrow-left"></i> 利用メニュー選択へ戻る
        </a>
        <form [action]="navigation.contextPath + '/Logout'" method="get">
            <button>ログアウト</button>
        </form>
    </div>
</main>

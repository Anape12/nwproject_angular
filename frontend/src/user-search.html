<main class="search-form">
    <h1>ユーザー情報検索</h1>
    <p>※ユーザー情報未入力の場合、全件検索となるためご注意ください。</p>
    <form method="post" [action]="searchUrl" name="form1">
        <input
            type="text"
            name="userId"
            [value]="userId"
            aria-label="ユーザーID"
            placeholder="ユーザーIDを入力してください"
        />
        <button class="search-btn" type="submit">検索</button>
    </form>

    @if (searchFailed) {
        <p role="alert">ユーザー情報を検索できませんでした。再度お試しください。</p>
    } @else if (results?.length) {
        <table>
            <thead>
                <tr class="tr-back">
                    <th scope="col">No</th>
                    <th scope="col">ユーザーID</th>
                    <th scope="col">権限レベル（1:管理者/2:通常）</th>
                </tr>
            </thead>
            <tbody>
                @for (user of results; track user.id) {
                    <tr>
                        <td>{{ user.id }}</td>
                        <td><a [href]="editUrl(user.userId)">{{ user.userId }}</a></td>
                        <td>{{ user.permission }}</td>
                    </tr>
                }
            </tbody>
        </table>
    } @else if (results) {
        <p role="status">該当するユーザーはありません。</p>
    }
</main>
<button class="search-btn2" type="button" name="userInfo" (click)="closeWindow()">ウィンドウを閉じる</button>
